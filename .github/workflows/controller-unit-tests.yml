name: ROS pre-merge tests

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Controller unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install offline test dependencies
        run: |
          python -m pip install pytest packaging playwright \
            'pykinisi @ git+https://github.com/szolotykh/pykinisi.git@2fd834b6c390e94c405e002a9797889a20c7525b' \
            -r src/roskinisi/requirements.txt -r src/kinisirobot/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run driver, robot and browser unit tests
        run: |
          # Browser coverage is optional on a robot but required in CI.
          python -c 'from playwright.sync_api import sync_playwright'
          python -m pytest -q --collect-only src/kinisirobot/test/test_map_ui.py
          # The release checklist runs the ROS-only lint wrappers separately.
          python -m pytest -q src/roskinisi/test \
            --ignore=src/roskinisi/test/test_copyright.py \
            --ignore=src/roskinisi/test/test_flake8.py \
            --ignore=src/roskinisi/test/test_pep257.py
          python -m pytest -q src/kinisirobot/test
